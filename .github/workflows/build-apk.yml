name: Build APK

on:
  push:
    paths:
      - 'upload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Unzip all parts in order
        run: |
          find upload -maxdepth 1 -name '*.zip' | sort | while read -r z; do
            echo "Extracting $z"
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -q -o "$z" -d /tmp/x
            n=$(ls -A /tmp/x | wc -l)
            first=$(ls -A /tmp/x | head -n 1)
            if [ "$n" = "1" ] && [ -d "/tmp/x/$first" ]; then
              src="/tmp/x/$first"
            else
              src="/tmp/x"
            fi
            cp -a "$src"/. .
          done
          ls -la

      - name: Save extracted project to repo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-extract parts from upload folder"
          git push || true

      - name: Use compatibility renderer for Android
        run: |
          sed -i 's/renderer\/rendering_method="mobile"/renderer\/rendering_method="gl_compatibility"/' project.godot
          sed -i 's/"Mobile"/"GL Compatibility"/' project.godot
          grep -n -E "rendering_method|features" project.godot

      - name: Install export templates
        run: |
          V="${GODOT_VERSION:-4.2.2}"
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${V}.stable ~/.local/share/godot/export_templates/

      - name: Setup Android export
        run: |
          mkdir -p ~/.config/godot
          cp /root/.config/godot/editor_settings-4*.tres ~/.config/godot/
          JAVA_SDK=$(dirname $(dirname $(readlink -f $(which javac) 2>/dev/null) 2>/dev/null) 2>/dev/null)
          if [ ! -d "$JAVA_SDK/bin" ]; then
            JAVA_SDK=$(ls -d /usr/lib/jvm/*/ | head -n 1)
          fi
          echo "Java SDK: $JAVA_SDK"
          for f in ~/.config/godot/editor_settings-4*.tres; do
            sed -i '/java_sdk_path/d' "$f"
            echo "" >> "$f"
            echo "export/android/java_sdk_path = \"$JAVA_SDK\"" >> "$f"
          done

      - name: Create export preset
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/lahore-driving-sim.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.lahoredrivingsim"
          package/name="Lahore Driving Sim"
          package/signed=true
          screen/immersive_mode=true
          EOF

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --import || true
          set +e
          godot --headless --verbose --export-debug "Android" build/lahore-driving-sim.apk > build/log.txt 2>&1
          CODE=$?
          echo "===== EXIT CODE: $CODE ====="
          echo "===== KEY LINES ====="
          grep -n -i -E "error|invalid|missing|required|could not|not found|should|only" build/log.txt | tail -n 40
          ls -la build
          exit $CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lahore-driving-sim-apk
          path: build/*.apk
