name: Build APK

on:
  push:
    paths:
      - 'upload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Unzip all parts in order
        run: |
          find upload -maxdepth 1 -name '*.zip' | sort | while read -r z; do
            echo "Extracting $z"
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -q -o "$z" -d /tmp/x
            n=$(ls -A /tmp/x | wc -l)
            first=$(ls -A /tmp/x | head -n 1)
            if [ "$n" = "1" ] && [ -d "/tmp/x/$first" ]; then
              src="/tmp/x/$first"
            else
              src="/tmp/x"
            fi
            cp -a "$src"/. .
          done
          ls -la

      - name: Save extracted project to repo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-extract parts from upload folder"
          git push || true

      - name: Install export templates
        run: |
          V="${GODOT_VERSION:-4.2.2}"
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/${V}.stable ~/.local/share/godot/export_templates/

      - name: Setup Android export
        run: |
          mkdir -p ~/.config/godot
          cp /root/.config/godot/editor_settings-4*.tres ~/.config/godot/ 2>/dev/null || true
          if [ ! -f ~/.config/godot/editor_settings-4.tres ]; then
            echo "Image settings not found, writing own"
            JAVA_SDK="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          fi

      - name: Create export preset
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/lahore-driving-sim.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.lahoredrivingsim"
          package/name="Lahore Driving Sim"
          package/signed=true
          screen/immersive_mode=true
          EOF

      - name: Build APK
        run: |
          echo "===== EDITOR SETTINGS ====="
          cat ~/.config/godot/editor_settings-4.tres || true
          echo "===== SDK FOLDERS ====="
          ls /usr/lib/android-sdk /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platform-tools || true
          echo "===== KEYSTORES ====="
          ls -la ~/*.keystore /root/*.keystore || true
          echo "===== BUILD ====="
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/lahore-driving-sim.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lahore-driving-sim-apk
          path: build/*.apk
